name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: teclado-remoto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk teclado-remoto.apk
          gh release delete ultima --cleanup-tag --yes || true
          gh release create ultima teclado-remoto.apk \
            --target "$GITHUB_SHA" \
            --title "Teclado remoto (última versión)" \
            --notes "APK para instalar en la tablet. Compilado desde el commit ${GITHUB_SHA:0:7}."
