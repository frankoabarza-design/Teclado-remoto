plugins {
    id 'com.android.application'
}

android {
    namespace 'com.frankoabarza.tecladoremoto'
    compileSdk 34

    defaultConfig {
        applicationId 'com.frankoabarza.tecladoremoto'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Llave fija incluida en el repositorio: así cada APK nuevo se instala encima del anterior
    // sin desinstalar. Es solo para uso personal, no para publicar en Play Store.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
